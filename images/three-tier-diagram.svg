<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 985" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Three-tier system architecture</title>
  <desc id="d">Data tier with a SQL Server 2000 database server and RAID 5, middle tier with an application server, web servers and a print server, and presentation tier with marketing department desktops and external clients.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#333"/>
    </marker>
    <style>
      .band-data { fill: #f4f0fb; }
      .band-mid  { fill: #eef6f1; }
      .band-pres { fill: #f6f6f6; }
      .tier  { font-size: 15px; font-weight: 600; fill: #4b0aa8; }
      .box   { fill: #fff; stroke: #333; stroke-width: 1.5; }
      .future{ fill: #fff; stroke: #777; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .t1    { font-size: 15px; font-weight: 600; fill: #222; text-anchor: middle; }
      .t2    { font-size: 12.5px; fill: #444; text-anchor: middle; }
      .note  { font-size: 12px; fill: #444; }
      .noteR { font-size: 12px; fill: #444; text-anchor: end; }
      .fut   { font-size: 12px; fill: #777; font-style: italic; text-anchor: middle; }
      .line  { stroke: #333; stroke-width: 1.5; fill: none; }
      .lineF { stroke: #777; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
    </style>
  </defs>

  <rect width="900" height="985" fill="#fff"/>
  <rect class="band-data" x="10" y="10"  width="880" height="240" rx="6"/>
  <rect class="band-mid"  x="10" y="262" width="880" height="378" rx="6"/>
  <rect class="band-pres" x="10" y="652" width="880" height="318" rx="6"/>

  <!-- Data tier -->
  <text class="tier" x="24" y="36">Data tier (back end)</text>

  <rect class="future" x="40" y="62" width="180" height="70" rx="6"/>
  <text class="t1" x="130" y="92">Online host</text>
  <text class="t2" x="130" y="112">DB server</text>
  <path class="lineF" d="M220 97 H300" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="fut" x="260" y="89">future</text>

  <rect class="box" x="300" y="52" width="240" height="88" rx="6"/>
  <text class="t1" x="420" y="82">Database server</text>
  <text class="t2" x="420" y="102">SQL Server 2000</text>
  <text class="t2" x="420" y="120">Windows Server 2003</text>

  <path class="line" d="M540 90 H640" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect class="box" x="640" y="52" width="220" height="76" rx="6"/>
  <text class="t1" x="750" y="86">Data store</text>
  <text class="t2" x="750" y="106">tables and data</text>
  <text class="note" x="640" y="152">DDL: data definition language</text>
  <text class="note" x="640" y="170">(data structure and definition)</text>
  <text class="note" x="640" y="190">DML: data manipulation language</text>
  <text class="note" x="640" y="208">(data manipulation)</text>

  <rect class="box" x="240" y="180" width="130" height="48" rx="6"/>
  <text class="t1" x="305" y="200">RAID 5</text>
  <text class="t2" x="305" y="218">hardware</text>
  <path class="line" d="M340 140 L305 180" marker-start="url(#a)" marker-end="url(#a)"/>

  <rect class="box" x="470" y="180" width="130" height="48" rx="6"/>
  <text class="t1" x="535" y="200">RAID 5</text>
  <text class="t2" x="535" y="218">software</text>
  <path class="line" d="M500 140 L535 180" marker-start="url(#a)" marker-end="url(#a)"/>

  <text class="note" x="24" y="244">Windows Server 2003 license includes 25 CALs</text>

  <path class="line" d="M420 140 V292" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- Middle tier -->
  <text class="tier" x="24" y="288">Middle tier (application)</text>

  <rect class="box" x="300" y="292" width="240" height="80" rx="6"/>
  <text class="t1" x="420" y="326">Application server</text>
  <text class="t2" x="420" y="346">DBMS driver</text>

  <path class="lineF" d="M540 332 H640" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="fut" x="590" y="324">future</text>
  <rect class="future" x="640" y="296" width="220" height="72" rx="6"/>
  <text class="t1" x="750" y="326">Transaction server</text>
  <text class="t2" x="750" y="346">for another department</text>

  <text class="note" x="24" y="316">Business service: data validation,</text>
  <text class="note" x="24" y="334">enforces business rules</text>
  <text class="note" x="24" y="356">Data service: connects to the database,</text>
  <text class="note" x="24" y="374">passes data to and from the data store</text>

  <path class="line" d="M370 372 L185 470" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="line" d="M420 372 V470" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="line" d="M470 372 L645 470" marker-start="url(#a)" marker-end="url(#a)"/>

  <rect class="box" x="100" y="470" width="170" height="76" rx="6"/>
  <text class="t1" x="185" y="502">Web server</text>
  <text class="t2" x="185" y="522">Internet Information Services</text>

  <rect class="box" x="330" y="470" width="180" height="76" rx="6"/>
  <text class="t1" x="420" y="502">Web server</text>
  <text class="t2" x="420" y="522">Internet Information Services</text>

  <rect class="box" x="560" y="470" width="170" height="76" rx="6"/>
  <text class="t1" x="645" y="502">Print server</text>
  <text class="t2" x="645" y="522">print / file service</text>

  <path class="line" d="M730 508 H780" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect class="box" x="780" y="484" width="90" height="48" rx="6"/>
  <text class="t1" x="825" y="514">Printer</text>

  <text class="note" x="24" y="582">Application server, business side:</text>
  <text class="note" x="24" y="600">web servers deliver the application to users</text>

  <path class="line" d="M185 546 V720" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="line" d="M420 546 V720" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- Presentation tier -->
  <text class="tier" x="24" y="678">Presentation tier</text>
  <text class="note" x="24" y="698">Windows and web user input,</text>
  <text class="note" x="24" y="714">limited data validation</text>

  <rect class="box" x="100" y="720" width="700" height="50" rx="6"/>
  <text class="t1" x="450" y="751">Network (web browser)</text>

  <path class="line" d="M120 770 V830" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="line" d="M240 770 V830" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="line" d="M360 770 V830" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="line" d="M480 770 V830" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="line" d="M600 770 V830" marker-start="url(#a)" marker-end="url(#a)"/>

  <rect class="box" x="60"  y="830" width="120" height="56" rx="6"/>
  <text class="t1" x="120" y="854">Desktop</text><text class="t2" x="120" y="872">phone sales</text>
  <rect class="box" x="180" y="830" width="120" height="56" rx="6"/>
  <text class="t1" x="240" y="854">Desktop</text><text class="t2" x="240" y="872">phone sales</text>
  <rect class="box" x="300" y="830" width="120" height="56" rx="6"/>
  <text class="t1" x="360" y="854">Desktop</text><text class="t2" x="360" y="872">P.S.</text>
  <rect class="box" x="420" y="830" width="120" height="56" rx="6"/>
  <text class="t1" x="480" y="854">Desktop</text><text class="t2" x="480" y="872">P.S.</text>
  <rect class="box" x="540" y="830" width="120" height="56" rx="6"/>
  <text class="t1" x="600" y="854">Desktop</text><text class="t2" x="600" y="872">P.S.</text>

  <path class="line" d="M785 830 V770" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="noteR" x="775" y="800">External license for</text>
  <text class="noteR" x="775" y="816">Windows Server 2003</text>
  <rect class="box" x="700" y="830" width="170" height="56" rx="6"/>
  <text class="t1" x="785" y="854">External clients</text>
  <text class="t2" x="785" y="872">order online directly</text>

  <text class="t1" x="60" y="920" style="text-anchor:start">Marketing department</text>
  <text class="note" x="60" y="940">Each desktop runs Windows XP Professional</text>
  <text class="note" x="60" y="958">and uses one client access license (CAL)</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
